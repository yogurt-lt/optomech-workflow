<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照明加投影整机 | Optomech Design Skill</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173348;background:#f1f5f7}body{margin:0}main{max-width:1120px;margin:auto;padding:1rem}header{display:flex;justify-content:space-between;gap:1rem;align-items:start}h1{margin:.2rem 0}p,li{line-height:1.55}a{color:#11636b}button{font:inherit;border:1px solid #8ba9ae;border-radius:8px;padding:.52rem .8rem;background:white;color:#153c49;cursor:pointer}button[aria-pressed=true]{background:#146b75;color:white}.stage{position:relative;background:#fafbfc;border-radius:14px;overflow:hidden;aspect-ratio:2;min-height:240px}.stage>*{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}canvas{touch-action:none;cursor:grab}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem;margin:.8rem 0}.controls input{width:min(100%,15rem);accent-color:#146b75}.readout{font-variant-numeric:tabular-nums}.static{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}figure{margin:0;background:white;border-radius:12px;padding:.65rem}figure img{width:100%;display:block}figcaption{margin:.5rem}small{color:#416073}body.embed .standalone{display:none}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><div><a class="standalone" href="./" data-en="← Case gallery">← 案例列表</a><h1 data-en="Complete illumination and projection assembly">照明加投影整机</h1><p data-en="The short cam ring rotates while the straight guide moves the complete projection cartridge axially.">短凸轮环旋转，直槽导向带动投影镜头整组轴向移动。</p></div><button id="language" type="button">English</button></header>
<div class="stage"><img id="poster" src="illumination-assets/assembly.png" alt=""><canvas id="scene" hidden aria-label="3D CAD model"></canvas></div>
<p id="loading" role="status" data-en="Loading 3D geometry. This can take a moment on mobile.">正在载入三维几何，手机端可能需要等待片刻。</p>
<div class="controls" id="controls" hidden>
<button id="play" type="button" data-en="Play focus">播放调焦</button>
<label><span data-en="Focus angle">调焦角度</span> <input id="angle" type="range" min="-30" max="30" value="0" step=".1"></label><output class="readout" id="readout"></output>
<button id="explode" type="button" aria-pressed="false" data-en="Exploded view">爆炸视图</button>
<button id="reset" type="button" data-en="Reset view">重置视角</button>
<label><input id="transparent" type="checkbox" checked><span data-en="Transparent housing">外壳半透明</span></label>
</div>
<small data-en="Drag to rotate and scroll to zoom. The animation uses the nominal 1.20 mm mechanical stroke.">拖动旋转、滚轮缩放。动画按 1.20 mm 名义机械行程播放。</small>
<h2 data-en="Assembly order">装配顺序</h2>
<ol>
<li data-en="Load the illumination optics into the lower housing guides, then fit the upper cover.">照明元件先插入下壳导槽，再合上上盖。</li>
<li data-en="Load G4 to G1 into the front barrel. Seat G5 separately and load G6 to G9 from the prism side of the rear barrel. Tighten the retainers against the flat bearing lands.">前筒装 G4 至 G1。后筒独立前装 G5，再从棱镜端装 G6 至 G9，以压圈和平环带闭合承压路径。</li>
<li data-en="Join the lens cells, fit the guide and short ring to the illumination housing, slide in the cartridge and install the follower pins from outside.">用连接套合并前后镜筒。固定导向座和短环装到照明壳后，滑入整组镜筒，最后从外侧安装随动销。</li>
</ol>
<div class="static">
<figure><a href="illumination-assets/exploded.png"><img loading="lazy" src="illumination-assets/exploded.png" alt=""></a><figcaption data-en="Exploded positions show assembly relationships.">爆炸位置用于说明装配关系。</figcaption></figure>
<figure><a href="illumination-assets/section.png"><img loading="lazy" src="illumination-assets/section.png" alt=""></a><figcaption data-en="CAD section through the projection axis.">投影光轴的实际 CAD 剖面。</figcaption></figure>
</div>
</main>
<script src="illumination-preview.js"></script>
</body>
</html>
